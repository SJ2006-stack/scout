name: Deploy Scout

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE: ""
      - run: npm test
      - name: Pack the server and the built page
        run: |
          mkdir -p publish
          cp package.json package-lock.json publish/
          cp -R src dist publish/
      - uses: azure/webapps-deploy@v3
        with:
          app-name: sj-event-scout
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
