name: Deploy Scout

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE: ""
      - name: Pack the server and the built page
        run: |
          mkdir -p publish
          cp package.json package-lock.json publish/
          cp -R src dist scout-landing publish/
      - uses: actions/upload-artifact@v4
        with:
          name: publish
          path: publish
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: sj-event-scout
            secret: AZURE_WEBAPP_PUBLISH_PROFILE
          - app: sj-scout
            secret: AZURE_WEBAPP_PUBLISH_PROFILE_MAIN
          - app: sj-travel-scout
            secret: AZURE_WEBAPP_PUBLISH_PROFILE_TRAVEL
          - app: sj-food-scout
            secret: AZURE_WEBAPP_PUBLISH_PROFILE_FOOD
          - app: sj-shop-scout
            secret: AZURE_WEBAPP_PUBLISH_PROFILE_SHOP
          - app: sj-home-scout
            secret: AZURE_WEBAPP_PUBLISH_PROFILE_HOME
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: publish
          path: publish
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.app }}
          publish-profile: ${{ secrets[matrix.secret] }}
          package: publish
