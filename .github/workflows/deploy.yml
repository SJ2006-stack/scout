name: Deploy Scout

# Azure runs sjscoutacr.azurecr.io/scout-site:latest (Chromium is in that image).
# A zip deploy switches the sites back to NODE|22-lts and the browser worker cannot start.
# This workflow only checks the build. Container updates stay manual until this file is pushed.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE: ""
      - name: Pack the server and the built page
        run: |
          mkdir -p publish
          cp package.json package-lock.json publish/
          cp -R src dist publish/
      - uses: actions/upload-artifact@v4
        with:
          name: publish
          path: publish
          if-no-files-found: error
